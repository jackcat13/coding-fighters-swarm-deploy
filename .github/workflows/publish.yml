on:
  push:
    branches:
      - main

name: Send deployment

jobs:
  upload-config:
    name: "Send the deployment config to the remote host"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v2

      - name: "copy deploy config"
        uses: garygrossgarten/github-action-scp@release
        with:
          local: docker-compose.yml
          remote: docker-compose.yml
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: "copy deploy prometheus config"
        uses: garygrossgarten/github-action-scp@release
        with:
          local: prometheus/prometheus.yml
          remote: prometheus/prometheus.yml
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: "copy deploy grafana config"
        uses: garygrossgarten/github-action-scp@release
        with:
          local: grafana/provisioning/datasources/prometheus.yml
          remote: grafana/provisioning/datasources/prometheus.yml
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: "copy deploy loki config"
        uses: garygrossgarten/github-action-scp@release
        with:
          local: loki/loki.yml
          remote: loki/loki.yml
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: "copy deploy promtail config"
        uses: garygrossgarten/github-action-scp@release
        with:
          local: promtail/promtail.yml
          remote: promtail/promtail.yml
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

  deploy:
    name: "Automatic platform execution"
    needs: upload-config
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v2

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" > docker.env
            echo "GAME_API=${{ secrets.GAME_API }}" >> docker.env
            docker service rm $(docker service ls -q)
            docker stack deploy -c docker-compose.yml coding-fighters
