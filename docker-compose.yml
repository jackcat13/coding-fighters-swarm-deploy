version: "3"

configs:
  loki-config:
    file: ./loki/loki.yml
  promtail-config:
    file: ./promtail/promtail.yml

services:
  traefik:
    image: "traefik:2.11.3"
    # Commands listed below determine configuration of our traefik instance
    command:
      - "--api.insecure=true"
      - "--providers.docker=true" # Defines docker as a provider
      - "--providers.docker.swarmmode=true"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false" # Prevents from exposing all containers by default
      - "--entrypoints.web.address=:80" # Will listen to incoming requests on port 80
      - "--entrypoints.websecure.address=:443" # Another entrypoint on port 443 for HTTPS
      # Configure letsencrypt
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=christophehenry11@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certificates/acme.json"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
    # Here we map ports from container to our host machine
    # which means that port 80 on our machine will access port 80 in traefik service
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 8080
        published: 8080
        mode: host
      - target: 443
        published: 443
        mode: host
    # Here we will share docker.sock file that is present in our host machine
    # with this container. It will allow Traefik to listen to Docker events
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-public-certificates-volume:/certificates"
    networks:
      - traefik_webgateway
    restart: always
    deploy:
      labels:
        - "traefik.docker.network=traefik_webgateway"
      placement:
        constraints:
          - "node.role==manager"

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command: mongod --bind_ip_all
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role==manager
      endpoint_mode: dnsrr
    labels:
      - "traefik.docker.network=internal"

  test-container:
    image: alpine:latest
    command: tail -f /dev/null
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - "node.role==manager"

  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_DB: invoicer
      POSTGRES_USER: invoicer
      POSTGRES_PASSWORD: invoicer
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      placement:
        constraints:
          - node.role == manager

  invoicer:
    image: "someawesomedockerid/invoicer:latest"
    ports:
      - "8002:8000"
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.invoicer.rule=Host(`invoicer.coding-fighters.tech`)"
        - "traefik.http.services.invoicer.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik_webgateway"
        - "traefik.http.routers.invoicer.tls=true"
        - "traefik.http.routers.invoicer.tls.certresolver=letsencrypt"
        - "traefik.http.routers.invoicer.entrypoints=websecure"
    restart: on-failure
    networks:
      - traefik_webgateway
      - internal

  coding-fighters-back:
    image: "someawesomedockerid/coding-fighters-back:latest"
    env_file: docker.env
    ports:
      - "8000:8000"
    deploy:
      replicas: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.traefik.rule=Host(`api.coding-fighters.tech`)"
        - "traefik.http.services.back.loadbalancer.server.port=8000"
        - "traefik.docker.network=traefik_webgateway"
        # HTTPS configuration
        - "traefik.http.routers.traefik.tls=true"
        - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
        - "traefik.http.routers.traefik.entrypoints=websecure"
    restart: on-failure
    networks:
      - traefik_webgateway
      - internal

  coding-fighters-front:
    image: "someawesomedockerid/coding-fighters-front:latest"
    env_file: docker.env
    ports:
      - "8001:80"
    deploy:
      replicas: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.front.rule=Host(`coding-fighters.tech`)"
        - "traefik.http.services.front.loadbalancer.server.port=80"
        - "traefik.docker.network=traefik_webgateway"
        # HTTPS configuration
        - "traefik.http.routers.front.tls=true"
        - "traefik.http.routers.front.tls.certresolver=letsencrypt"
        - "traefik.http.routers.front.entrypoints=websecure"
    restart: on-failure
    networks:
      - traefik_webgateway

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - traefik_webgateway
      - monitoring
    environment:
      - GF_SERVER_ROOT_URL=https://coding-fighters.tech/analytics
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=PathPrefix(`/analytics`)"
        - "traefik.http.routers.priority=2"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"
        - "traefik.docker.network=traefik_webgateway"
        # HTTPS configuration
        - "traefik.http.routers.grafana.tls=true"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.routers.grafana.entrypoints=websecure"
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.listen-address=:9090"
    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    deploy:
      mode: global
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      mode: global
    networks:
      - monitoring
    command:
      - "--docker_only=true"

  loki:
    image: grafana/loki:latest
    configs:
      - source: loki-config
        target: /etc/loki/loki.yml
    command:
      - "-config.file=/etc/loki/loki.yml"
    volumes:
      - loki_data:/loki
    networks:
      - monitoring
    deploy:
      endpoint_mode: dnsrr

  promtail:
    image: grafana/promtail:latest
    configs:
      - source: promtail-config
        target: /etc/promtail/promtail.yml
    command:
      - "-config.file=/etc/promtail/promtail.yml"
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring
    deploy:
      endpoint_mode: dnsrr

networks:
  traefik_webgateway:
    name: traefik_webgateway
    attachable: true
    external: true
  internal:
    name: internal
    attachable: true
    external: true
    driver: overlay
  monitoring:
    driver: overlay
    attachable: true

# Explicitly define docker volume which stores certificates
volumes:
  mongo_data:
  postgresql_data:
  traefik-public-certificates-volume:
  grafana_data:
  prometheus_data:
  loki_data:
